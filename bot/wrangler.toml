# Воркер бота и ретранслятора Звонилки. Выкладка: cd bot && npx wrangler deploy
# Секреты (TELEGRAM_BOT_TOKEN) задаются в Cloudflare и при выкладке не меняются.
name = "zvonilka-bot"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
